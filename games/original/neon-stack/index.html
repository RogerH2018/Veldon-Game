<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>霓虹堆栈 · Neon Stack</title>
    <noscript><meta http-equiv="refresh" content="0; url=https://rogerh2018.github.io/veldon-002-original-neon-stack/"></noscript>
  </head>
  <body>
    <a id="play" href="https://rogerh2018.github.io/veldon-002-original-neon-stack/">试玩霓虹堆栈 · Play Neon Stack</a>
    <script>
      const play = document.getElementById("play");
      const destination = new URL(play.href);
      let language = new URLSearchParams(location.search).get("lang");
      if (language !== "en" && language !== "zh") {
        try { language = localStorage.getItem("veldon-language"); } catch {}
      }
      if (language === "en" || language === "zh") destination.searchParams.set("lang", language);
      play.href = destination.href;
      location.replace(destination.href);
    </script>
  </body>
</html>
