<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Veldon Game 用 AI 打磨原创网页游戏，也分享来自开源社区的精选作品。" data-en-content="Play original browser games made with AI and discover games from the open-source community.">
    <meta name="theme-color" content="#0d1119">
    <title data-en="Veldon Game · Original and Open-Source Games">Veldon Game · 自制与开源游戏</title>
    <link rel="icon" href="assets/veldon-game.png" type="image/png">
    <link rel="stylesheet" href="assets/home.css">
    <script src="assets/language.js" defer></script>
    <script src="games.js" defer></script>
    <script src="assets/visitors.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <div class="shell header-inner">
        <a class="brand" href="./index.html">
          <img src="assets/veldon-game.png" alt="" width="48" height="48">
          <span>Veldon Game</span>
        </a>
        <nav class="site-nav" aria-label="主导航" data-en-label="Main navigation">
          <a href="games/original/index.html" data-en="Original Games">自制游戏</a>
          <a href="games/open-source/index.html" data-en="Open-Source Games">开源游戏</a>
          <a href="studio/index.html" data-en="AI Game Studio">AI 游戏工作室</a>
        </nav>
        <div class="header-tools">
          <a class="language-link" href="?lang=en" data-language-switch lang="en" hreflang="en">English</a>
          <a class="repo-link" href="https://github.com/RogerH2018/Veldon-Game">GitHub</a>
        </div>
      </div>
    </header>

    <main class="shell">
      <section class="hero" aria-labelledby="hero-title">
        <div class="hero-art" aria-hidden="true">
          <img src="assets/arcade-hero.webp" alt="" width="1942" height="809" fetchpriority="high">
        </div>
        <div class="hero-copy">
          <h1 id="hero-title"><span data-en="Old memories.">把童年，</span><br><span class="hero-accent" data-en="New games.">玩成新游戏。</span></h1>
          <p class="hero-description"><span data-en="We make original games with AI">我们用 AI 制作原创游戏，</span><br><span data-en="and share games from the open-source community.">也分享开源社区中的优秀作品。</span></p>
        </div>
      </section>

      <section class="library" id="games" aria-labelledby="library-title">
        <h2 class="section-title" id="library-title" data-en="Game Catalog">游戏目录</h2>
        <div class="catalog-grid">
          <section class="catalog-panel" data-game-category="original" data-game-limit="2" aria-labelledby="original-title">
            <h3 id="original-title" data-en="Original Games">自制游戏</h3>
            <p data-en="We start with a simple idea and use AI to build toward 1,000 original games.">从一个简单的点子出发，用 AI 一起做 1,000 款原创游戏。</p>
            <ul class="game-grid" aria-label="自制游戏预览" data-en-label="Original game previews"></ul>
            <div class="catalog-actions">
              <a class="secondary-link" href="games/original/index.html" data-en="Browse Original Games">浏览自制游戏</a>
              <a class="text-link" href="progress/original/index.html" data-en="Original Game Log">自制游戏周报</a>
            </div>
          </section>
          <section class="catalog-panel" data-game-category="open-source" data-game-limit="2" aria-labelledby="open-source-title">
            <h3 id="open-source-title" data-en="Open-Source Games">开源游戏</h3>
            <p data-en="Discover games from the open-source community, with creator credits and links to play and view source.">收录来自开源社区的作品，附上原作者、源码和试玩入口。</p>
            <ul class="game-grid" aria-label="开源游戏预览" data-en-label="Open-source game previews"></ul>
            <div class="catalog-actions">
              <a class="secondary-link" href="games/open-source/index.html" data-en="Browse Open-Source Games">浏览开源游戏</a>
              <a class="text-link" href="progress/open-source/index.html" data-en="Open-Source Game Log">开源游戏周报</a>
            </div>
          </section>
        </div>
      </section>
    </main>

    <footer class="shell site-footer">
      <small>© 2026 Veldon Game</small>
    </footer>
  </body>
</html>
