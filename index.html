<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Veldon Game 的网页游戏目录。发现我们制作的原创游戏和来自开源社区的作品。">
    <meta name="theme-color" content="#0d1119">
    <title>Veldon Game · 自制与开源游戏</title>
    <link rel="icon" href="assets/veldon-game.png" type="image/png">
    <link rel="stylesheet" href="assets/home.css">
    <script src="games.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <div class="shell header-inner">
        <a class="brand" href="./index.html">
          <img src="assets/veldon-game.png" alt="" width="42" height="42">
          <span>Veldon Game</span>
        </a>
        <nav class="site-nav" aria-label="主导航">
          <a href="games/original/index.html">自制游戏</a>
          <a href="games/open-source/index.html">开源游戏</a>
        </nav>
        <a class="repo-link" href="https://github.com/RogerH2018/Veldon-Game">GitHub</a>
      </div>
    </header>

    <main class="shell">
      <section class="hero" aria-labelledby="hero-title">
        <div class="hero-art" aria-hidden="true">
          <img src="assets/arcade-hero.webp" alt="" width="1942" height="809" fetchpriority="high">
        </div>
        <div class="hero-copy">
          <h1 id="hero-title">把童年，<br><span>玩成新游戏。</span></h1>
          <p class="hero-description">这里收录 Veldon 自己制作的网页游戏，也分享值得试玩的开源作品。</p>
          <a class="primary-link" href="#games">查看游戏目录</a>
        </div>
      </section>

      <section class="library" id="games" aria-labelledby="library-title">
        <h2 class="section-title" id="library-title">游戏目录</h2>
        <div class="catalog-grid">
          <section class="catalog-panel" data-game-category="original" data-game-limit="2" aria-labelledby="original-title">
            <h3 id="original-title">自制游戏</h3>
            <p>从一个简单的点子出发，用 AI 一起做 1,000 款原创游戏。</p>
            <ul class="game-grid" aria-label="自制游戏预览"></ul>
            <div class="catalog-actions">
              <a class="secondary-link" href="games/original/index.html">浏览自制游戏</a>
              <a class="text-link" href="https://github.com/RogerH2018/Veldon-Game/blob/main/progress/README.md">自制游戏周报</a>
            </div>
          </section>
          <section class="catalog-panel" data-game-category="open-source" data-game-limit="2" aria-labelledby="open-source-title">
            <h3 id="open-source-title">开源游戏</h3>
            <p>收录来自开源社区的作品，附上原作者、源码和试玩入口。</p>
            <ul class="game-grid" aria-label="开源游戏预览"></ul>
            <div class="catalog-actions">
              <a class="secondary-link" href="games/open-source/index.html">浏览开源游戏</a>
              <a class="text-link" href="progress/open-source/index.html">开源游戏周报</a>
            </div>
          </section>
        </div>
      </section>
    </main>

    <footer class="shell site-footer">
      <small>© 2026 Veldon Game</small>
    </footer>
  </body>
</html>
